{% extends "base.html" %}
{% block title %}Page Not Found - Awesome Karts{% endblock %}

{% block content %}
<section class="flex flex-col items-center justify-center text-center min-h-[70vh] px-6">

    <div class="w-8 h-0.5 bg-ak-purple mb-6"></div>

    <h1 class="text-7xl font-extrabold text-white tracking-tight mb-4">ERROR 404</h1>
    <p class="text-ak-muted text-lg mb-8 leading-relaxed max-w-xl">
        Looks like you've taken a wrong turn. The page you're looking for doesn't exist or may have been moved.
    </p>

    <div class="flex items-center gap-3">
        <a href="/"
           class="inline-flex items-center gap-2 bg-ak-purple text-white font-semibold pl-5 pr-1.5 py-1.5 rounded-full hover:bg-purple-600 transition-colors text-sm">
            <span>Back to Home</span>
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-purple-900/60">
                <img src="/static/img/uprightarrow.svg" alt="" class="w-3.5 h-3.5 invert">
            </span>
        </a>
        <a href="/bookings"
           class="inline-flex items-center gap-2 bg-ak-card border border-ak-border text-white font-semibold px-6 py-2.5 rounded-full hover:border-ak-purple transition-colors text-sm">
            Book a Session
        </a>
    </div>

</section>
{% endblock %}

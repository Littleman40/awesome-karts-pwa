{% extends "base.html" %}
{% block title %}Forgot Password - Awesome Karts{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center px-6 py-24">
    <h1 class="text-3xl font-bold text-white mb-8">Forgot Password</h1>
    <div class="bg-ak-card border border-ak-border rounded-xl p-8 w-full max-w-md">
        <form id="forgot-password-form" class="space-y-5" novalidate>
            <p class="text-ak-muted text-sm">Enter your account email and we'll send you a link to reset your password.</p>
            <div>
                <label for="forgot-email" class="block text-white text-sm font-medium mb-1.5">Email</label>
                <input id="forgot-email" name="email" type="email" required autocomplete="email"
                       class="w-full bg-ak-border text-white placeholder-ak-hint text-sm rounded-lg px-4 py-2.5 border border-ak-border focus:outline-none focus:border-ak-purple transition-colors">
            </div>

            <p data-form-error class="hidden text-sm text-red-400"></p>
            <p data-form-success class="hidden text-sm text-green-400"></p>

            <button type="submit"
                    class="w-full bg-ak-purple hover:bg-purple-600 text-white font-medium text-sm py-3 rounded-full transition-colors">
                Send reset link
            </button>

            <div class="text-center">
                <a href="/login" class="text-ak-muted text-sm hover:text-white underline transition-colors">Back to log in</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Reset Password - Awesome Karts{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center px-6 py-24">
    <h1 class="text-3xl font-bold text-white mb-8">Reset Password</h1>
    <div class="bg-ak-card border border-ak-border rounded-xl p-8 w-full max-w-md">
        <form id="reset-password-form" class="space-y-5" novalidate>
            <input type="hidden" name="token" value="{{ token | e }}">
            <div>
                <label for="reset-password" class="block text-white text-sm font-medium mb-1.5">New password</label>
                <input id="reset-password" name="password" type="password" required autocomplete="new-password"
                       class="w-full bg-ak-border text-white placeholder-ak-hint text-sm rounded-lg px-4 py-2.5 border border-ak-border focus:outline-none focus:border-ak-purple transition-colors">
                <p class="text-ak-hint text-xs mt-1.5">At least 8 characters, with a letter and a number.</p>
            </div>
            <div>
                <label for="reset-confirm-password" class="block text-white text-sm font-medium mb-1.5">Confirm new password</label>
                <input id="reset-confirm-password" name="confirm_password" type="password" required autocomplete="new-password"
                       class="w-full bg-ak-border text-white placeholder-ak-hint text-sm rounded-lg px-4 py-2.5 border border-ak-border focus:outline-none focus:border-ak-purple transition-colors">
            </div>

            <p data-form-error class="hidden text-sm text-red-400"></p>
            <p data-form-success class="hidden text-sm text-green-400"></p>

            <button type="submit"
                    class="w-full bg-ak-purple hover:bg-purple-600 text-white font-medium text-sm py-3 rounded-full transition-colors">
                Update password
            </button>

            <div class="text-center">
                <a href="/login" class="text-ak-muted text-sm hover:text-white underline transition-colors">Back to log in</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

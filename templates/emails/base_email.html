<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block subject %}Awesome Karts{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#F3F4F6; font-family:Helvetica,Arial,sans-serif; color:#1F2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F3F4F6; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#FFFFFF; border-radius:12px; overflow:hidden; border:1px solid #E5E7EB;">
                    <tr>
                        <td style="height:4px; background-color:#A855F7; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td style="padding:28px 32px 8px 32px;">
                            <span style="font-size:20px; font-weight:700; color:#111827; letter-spacing:-0.5px;">Awesome Karts</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 28px 32px; font-size:15px; line-height:1.6; color:#374151;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px; background-color:#F9FAFB; border-top:1px solid #E5E7EB; font-size:12px; line-height:1.6; color:#6B7280;">
                            <p style="margin:0 0 4px 0; font-weight:600; color:#374151;">Awesome Karts</p>
                            {% if business.address %}<p style="margin:0;">{{ business.address }}</p>{% endif %}
                            {% if business.phone %}<p style="margin:0;">{{ business.phone }}</p>{% endif %}
                            {% if business.email %}<p style="margin:0;"><a href="mailto:{{ business.email }}" style="color:#A855F7; text-decoration:none;">{{ business.email }}</a></p>{% endif %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>

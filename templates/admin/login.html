<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Log In - Awesome Karts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    <meta name="theme-color" content="#A855F7">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ak-bg':     '#000000',
                        'ak-card':   '#161616',
                        'ak-border': '#1F1F1F',
                        'ak-purple': '#A855F7',
                        'ak-muted':  '#A0A0A0',
                        'ak-hint':   '#6B7280',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-ak-bg text-white font-sans min-h-screen flex items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">
        <div class="bg-ak-card border border-ak-border rounded-xl p-8">
            <h1 class="text-xl font-bold text-white mb-1 text-center">Admin Log In</h1>
            <form id="admin-login-form" class="space-y-5" novalidate>
                <div>
                    <label for="admin-email" class="block text-white text-sm font-medium mb-1.5">Email</label>
                    <input id="admin-email" name="email" type="email" required autocomplete="email"
                           class="w-full bg-ak-border text-white placeholder-ak-hint text-sm rounded-lg px-4 py-2.5 border border-ak-border focus:outline-none focus:border-ak-purple transition-colors">
                </div>
                <div>
                    <label for="admin-password" class="block text-white text-sm font-medium mb-1.5">Password</label>
                    <input id="admin-password" name="password" type="password" required autocomplete="current-password"
                           class="w-full bg-ak-border text-white placeholder-ak-hint text-sm rounded-lg px-4 py-2.5 border border-ak-border focus:outline-none focus:border-ak-purple transition-colors">
                </div>

                <p data-form-error class="hidden text-sm text-red-400"></p>

                <button type="submit"
                        class="w-full bg-ak-purple hover:bg-purple-600 text-white font-medium text-sm py-3 rounded-full transition-colors">
                    Log In
                </button>
            </form>
        </div>

        <p class="text-ak-hint text-xs text-center mt-6">
            Not staff? <a href="/" class="text-ak-muted hover:text-white underline">Return to the public site</a>
        </p>
    </div>

<script src="/static/js/admin.js"></script>
</body>
</html>

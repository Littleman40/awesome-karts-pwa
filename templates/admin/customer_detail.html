{% extends "admin/base.html" %}
{% block title %}Customer Profile - Admin{% endblock %}

{% block content %}
<div id="customer-detail-root" data-user-id="{{ user_id }}">

    <div class="mb-4">
        <a href="/admin/customers"
           class="inline-flex items-center gap-1.5 text-ak-muted hover:text-white text-sm transition-colors">
            <img src="/static/img/left.svg" alt="" class="w-4 h-4 invert opacity-60">
            Back
        </a>
    </div>

    <div class="mb-6">
        <div class="w-8 h-0.5 bg-ak-purple mb-3"></div>
        <h1 id="cd-name" class="text-2xl font-bold text-white">Loading…</h1>
        <p id="cd-email" class="text-ak-muted text-sm mt-1"></p>
    </div>

    <div id="cd-loading" class="text-ak-muted text-sm py-4">Loading customer profile…</div>
    <p id="cd-error" class="hidden text-red-400 text-sm py-4"></p>

    <div id="cd-body" class="hidden">
        <div class="bg-ak-card border border-ak-border rounded-xl overflow-hidden">

            <div class="px-5 py-5">
                <p class="text-white font-semibold text-sm mb-4">Personal Details</p>
                <div id="cd-details" class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm"></div>
            </div>

            <div class="border-t border-ak-border"></div>

            <div class="px-5 py-5">
                <p class="text-white font-semibold text-sm mb-3">Adult Waiver</p>
                <div id="cd-waiver" class="text-sm"></div>
            </div>

            <div class="border-t border-ak-border"></div>

            <div class="px-5 py-5">
                <p class="text-white font-semibold text-sm mb-3">Registered Minors</p>
                <div id="cd-minors"></div>
            </div>

            <div class="border-t border-ak-border"></div>

            <div class="px-5 py-5">
                <p class="text-white font-semibold text-sm mb-4">All Bookings</p>
                <div id="cd-bookings" class="space-y-3"></div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
